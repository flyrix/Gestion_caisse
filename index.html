<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/style.css?v=1.0.5" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#3498db" />
    <title>Connexion - Gestion de Caisse</title>
</head>
<body>
    <main class="auth-container">
        <h1 id="auth-title">Connexion</h1>

        <div class="auth-card">
            <p id="auth-desc" class="auth-description">Connectez-vous pour accéder à votre carnet de caisse et synchroniser vos opérations.</p>

            <form id="auth-form">
                <!-- Champ Identifiant (E-mail ou Pseudo) -->
                <label id="label-identifier" for="identifier">Email ou nom d'utilisateur</label>
                <input type="text" id="identifier" name="identifier" autocomplete="username" placeholder="votre@exemple.com ou monutilisateur" required />

                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Mot de passe" required />

                <!-- Bloc Inscription -->
                <div id="signup-profile-group" hidden>
                    <label for="signup-username">Nom d'utilisateur (Pseudo)</label>
                    <input type="text" id="signup-username" name="signup-username" autocomplete="nickname" placeholder="Choisissez un nom d'utilisateur" />
                </div>

                <div class="auth-actions" style="margin-top: 15px; display: flex; flex-direction: column; gap: 10px;">
                    <button id="btn-principal" type="submit">Se connecter</button>
                    <button id="btn-basculer" type="button" class="btn-secondaire">Pas de compte ? S'inscrire</button>
                </div>
            </form>

            <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;" />
            <button id="btn-reset" type="button" class="btn-secondaire">Mot de passe oublié</button>

            <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;" />
            <button id="btn-guest" type="button" class="btn-guest" title="Utiliser l'app en mode hors-ligne sans connexion">📱 Utiliser sans connexion (Mode invité)</button>

            <!-- Zone de retour dynamique -->
            <div id="auth-message" class="auth-message" aria-live="polite" aria-atomic="true" style="margin-top: 10px; font-weight: bold;"></div>
        </div>
    </main>

    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('✅ Service Worker prêt (page d\'authentification)'))
                    .catch(err => console.warn('⚠️ Échec Service Worker:', err));
            });
        }
    </script>

    <!-- SDK Supabase (UMD) - chargé en async, les scripts app attendent sa disponibilité -->
    <script>
      (function() {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.js';
        s.integrity = 'sha384-Tgoms7a53eyQOCcKXlBrA1X967mm3BHK43f3979dACl74tZlLW+O85pmfCuhfUtx';
        s.crossOrigin = 'anonymous';
        s.onload = loadAppScripts;
        s.onerror = loadAppScripts; // charge quand même les scripts app si CDN échoue
        document.head.appendChild(s);

        function loadAppScripts() {
          var scripts = ['scripts/supabase-config.js', 'scripts/supabase.js', 'scripts/auth.js'];
          function loadNext(i) {
            if (i >= scripts.length) return;
            var a = document.createElement('script');
            a.src = scripts[i];
            a.onload = function() { loadNext(i + 1); };
            a.onerror = function() { loadNext(i + 1); };
            document.head.appendChild(a);
          }
          loadNext(0);
        }
      })();
    </script>
</body>
</html>
