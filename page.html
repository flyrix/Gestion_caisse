<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css?v=1.0.5">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3498db">
    <title>Caisse Vocale Intelligente avec Avatar Robot</title>

    <!-- Bibliothèque Lottie pour l'animation WebGL / JSON de l'avatar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js" defer></script>
</head>
<body>
    <header>
        <h1>Caisse Vocale 🎙️</h1>

        <div id="auth-bar" class="auth-bar" hidden>
            <span>Connecté(e) : <strong id="user-email"></strong></span>
            <button id="btn-deconnexion" type="button">Déconnexion</button>
        </div>
    </header>

    <!-- Interface Vocale Principale avec Avatar Robot Animé -->
    <main class="vocal-container">
        <!-- Bulle de dialogue parlante de l'Avatar -->
        <div id="robot-speech-bubble" class="speech-bubble" aria-live="polite">
            <p id="robot-message">Bonjour ! Que souhaitez-vous enregistrer aujourd'hui ?</p>
        </div>

        <!-- Conteneur de l'animation Lottie du Robot -->
        <div id="avatar-container" class="avatar-animation" title="Votre assistant virtuel"></div>

        <!-- Bouton Micro principal synchronisé avec le Robot -->
        <button id="btn-vocal-main" class="mic-button" type="button" aria-label="Activer le microphone">
            <span class="mic-icon">🎙️</span>
            <span id="mic-status">Appuyez pour répondre</span>
        </button>

        <div id="live-feedback" class="feedback-box" aria-live="polite">
            <p id="transcript-text">Exemple : <em>"Junior a réglé 2000 francs"</em> ou <em>"J'ai rendu 500 francs à Aka"</em></p>
            <p id="ai-response" class="ai-status"></p>
        </div>
    </main>

    <hr>

    <!-- Actions globales & Automatisation -->
    <nav class="zone-audio-globale" aria-label="Actions vocales et nettoyage">
        <button id="btn-lire-tout" type="button">🔊 Résumé vocal des comptes</button>
        <button id="btn-effacer-regles" type="button" class="btn-secondary">Nettoyer l'historique des réglés</button>
    </nav>

    <!-- Filtres d'affichage pour la gestion automatique des règlements -->
    <nav class="filter-bar" aria-label="Filtres d'affichage des comptes">
        <button id="filter-all" class="filter-btn active" type="button" onclick="filtrerComptes('tous')">Tous</button>
        <button id="filter-pending" class="filter-btn" type="button" onclick="filtrerComptes('encours')">En cours</button>
        <button id="filter-settled" class="filter-btn" type="button" onclick="filtrerComptes('soldes')">✅ Soldés / Réglés</button>
    </nav>

    <!-- Résumé financier -->
    <section id="resume" aria-label="Résumé du carnet">
        <div>
            <span>Total crédits en cours</span>
            <strong id="total-credits">0 FCFA</strong>
        </div>
        <div>
            <span>Total monnaies à rendre</span>
            <strong id="total-monnaies">0 FCFA</strong>
        </div>
        <div>
            <span>Solde net</span>
            <strong id="solde-net">0 FCFA</strong>
        </div>
    </section>

    <!-- Affichage des listes de crédits et monnaies -->
    <div id="listes-container">
        <section class="colonne">
            <h2>Ils me doivent (Crédits)</h2>
            <ul id="affichage-credits"></ul>
        </section>

        <section class="colonne">
            <h2>Je leur dois (Monnaies)</h2>
            <ul id="affichage-monnaies"></ul>
        </section>
    </div>

    <!-- Enregistrement du Service Worker pour le support PWA Hors-ligne -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('✅ Service Worker prêt (page principale)'))
                    .catch(err => console.warn('⚠️ Échec Service Worker:', err));
            });
        }
    </script>

    <!-- SDK Supabase stable (jsDelivr UMD) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.js"></script>
    <!-- Scripts applicatifs de l'application -->
    <script src="scripts/supabase-config.js"></script>
    <script src="scripts/supabase.js"></script>
    <script src="scripts/db.js"></script>
    <script src="scripts/auth.js"></script>
    <!-- Script de l'Avatar Visèmes (Lip-Sync 2D, Text-To-Speech & Accueil automatique) -->
    <script src="scripts/avatar-visemes.js?v=1.0.0"></script>
    <script src="scripts/script.js?v=1.0.3"></script>
</body>
</html>
