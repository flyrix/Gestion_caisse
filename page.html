<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/style.css?v=1.0.2" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#3498db" />
    <title>Caisse Vocale Intelligente</title>
</head>
<body>
    <h1>Caisse Vocale 🎙️</h1>

    <div id="auth-bar" class="auth-bar" hidden>
        <span>Connecté(e) : <strong id="user-email"></strong></span>
        <button id="btn-deconnexion" type="button">Déconnexion</button>
    </div>

    <!-- Interface Vocale Principale -->
    <main class="vocal-container">
        <button id="btn-vocal-main" class="mic-button">
            <span class="mic-icon">🎙️</span>
            <span id="mic-status">Appuyez et parlez</span>
        </button>

        <div id="live-feedback" class="feedback-box">
            <p id="transcript-text">Exemple : <em>"Moussa me doit 2000 francs"</em> ou <em>"J'ai rendu 500 francs à Awa"</em></p>
            <p id="ai-response" class="ai-status"></p>
        </div>
    </main>

    <hr />

    <div class="zone-audio-globale">
        <button id="btn-lire-tout">🔊 Résumé vocal des comptes</button>
        <button id="btn-effacer-regles">Effacer les réglés</button>
    </div>

    <section id="resume" aria-label="Résumé du carnet">
        <div>
            <span>Total crédits</span>
            <strong id="total-credits">0 FCFA</strong>
        </div>
        <div>
            <span>Total monnaies</span>
            <strong id="total-monnaies">0 FCFA</strong>
        </div>
        <div>
            <span>Solde net</span>
            <strong id="solde-net">0 FCFA</strong>
        </div>
    </section>

    <div id="listes-container">
        <section class="colonne">
            <h2>Ils me doivent (Crédits)</h2>
            <ul id="affichage-credits"></ul>
        </section>

        <section class="colonne">
            <h2>Je leur dois (Monnaies)</h2>
            <ul id="affichage-monnaies"></ul>
        </section>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase-config.js"></script>
    <script src="scripts/supabase.js"></script>
    <script src="scripts/db.js"></script>
    <script src="scripts/auth.js"></script>
    
    <script src="scripts/ai-vocal.js?v=1.0.0"></script>
    <script src="scripts/script.js?v=1.0.2"></script>
</body>
</html>
